<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="849" viewBox="0 0 1200 849" role="img" aria-labelledby="title desc">
<title id="title">Intelligence must arrive before the deadline</title><desc id="desc">Task reasoning, policy inference and fast feedback control must remain synchronized. An illustrative humanoid balances while reaching. Long action chunks can reduce compute demands but reduce immediate reactivity; thermal and energy budgets also constrain onboard processing.</desc>
<defs><marker id="arrow-087f83" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f83"/></marker><marker id="arrow-c76b2c" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#c76b2c"/></marker><marker id="arrow-396cc5" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#396cc5"/></marker><marker id="arrow-b74b53" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b74b53"/></marker><marker id="arrow-172f43" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#172f43"/></marker></defs><rect width="1200" height="849" fill="#fffaf2" rx="24"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
<text x="44" y="58" font-size="37" fill="#172f43" font-weight="700" text-anchor="start">Intelligence must arrive before the deadline</text><text x="44" y="98" font-size="24" fill="#536877" font-weight="400" text-anchor="start">Latency, body dynamics and limited onboard resources are coupled</text>
<rect x="44" y="145" width="610" height="489" rx="18" fill="white" stroke="#d8e0e3" stroke-width="2"/><text x="72" y="189" font-size="23" fill="#396cc5" font-weight="700" text-anchor="start">COORDINATE DIFFERENT TIMESCALES</text><g transform="translate(98 259) scale(0.7)"><rect x="-28" y="-24" width="56" height="48" rx="8" fill="none" stroke="#396cc5" stroke-width="3"/><path d="M-15,-10 H14 M-15,2 H18 M-15,14 H3" fill="none" stroke="#396cc5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="150" y="250" font-size="28" fill="#396cc5" font-weight="650" text-anchor="start">Task reasoning</text><text x="150" y="289" font-size="23" fill="#536877" font-weight="400" text-anchor="start">Plans and subgoals</text><path d="M374,306 L374,335" fill="none" stroke="#396cc5" stroke-width="3" marker-end="url(#arrow-396cc5)"/><g transform="translate(98 384) scale(0.7)"><circle cx="0" cy="0" r="29" fill="none" stroke="#087f83" stroke-width="3"/><path d="M0,-18 V0 L16,9" fill="none" stroke="#087f83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="150" y="375" font-size="28" fill="#087f83" font-weight="650" text-anchor="start">Policy inference</text><text x="150" y="414" font-size="23" fill="#536877" font-weight="400" text-anchor="start">Fresh observations; consistent actions</text><path d="M374,431 L374,460" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow-087f83)"/><g transform="translate(98 509) scale(0.7)"><circle cx="3" cy="-27" r="8" fill="none" stroke="#c76b2c" stroke-width="3"/><path d="M0,-16 L-6,8 L-27,29 M-6,8 L14,17 L23,35 M0,-12 L19,0 L30,-1 M0,-10 L-19,-1" fill="none" stroke="#c76b2c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="150" y="500" font-size="28" fill="#c76b2c" font-weight="650" text-anchor="start">Feedback control</text><text x="150" y="539" font-size="23" fill="#536877" font-weight="400" text-anchor="start">Balance, contact and actuator limits</text><rect x="682" y="145" width="474" height="489" rx="18" fill="#edf5f3" stroke="none" stroke-width="2"/><text x="710" y="189" font-size="23" fill="#087f83" font-weight="700" text-anchor="start">ONE PHYSICAL BODY</text><circle cx="881" cy="258" r="25" fill="none" stroke="#172f43" stroke-width="5"/><path d="M881,286 L864,370 L908,429 L915,507 M864,370 L822,432 L790,505 M881,303 L950,331 L1010,302 M881,307 L830,331 L800,377" fill="none" stroke="#172f43" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M766,515 H806 M900,515 H937" fill="none" stroke="#172f43" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><rect x="1014" y="271" width="40" height="40" rx="5" fill="#efad79" stroke="none" stroke-width="2"/><circle cx="881" cy="348" r="8" fill="#087f83" stroke="#087f83" stroke-width="3"/><path d="M881,359 V518" fill="none" stroke="#087f83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><path d="M756,527 H949" fill="none" stroke="#087f83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="968" y="417" font-size="23" fill="#c76b2c" font-weight="400" text-anchor="start">reach</text><text x="710" y="580" font-size="24" fill="#087f83" font-weight="600" text-anchor="start">Balance • reach • terrain • contact</text><rect x="44" y="664" width="1112" height="109" rx="18" fill="#f9eadb" stroke="none" stroke-width="2"/><text x="72" y="706" font-size="22" fill="#c76b2c" font-weight="700" text-anchor="start">THE TRADE-OFF</text><text x="72" y="747" font-size="25" fill="#172f43" font-weight="400" text-anchor="start">Less frequent policy updates save compute, but can delay reactions to surprises.</text>
<path d="M44,796 H1156" fill="none" stroke="#d8e0e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="825" font-size="20" fill="#536877" font-weight="400" text-anchor="start">Conceptual synthesis • 5 Nov 2026</text>
</g></svg>