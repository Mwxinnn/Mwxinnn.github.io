<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="813" viewBox="0 0 1200 813" role="img" aria-labelledby="title desc">
<title id="title">Seeing an object is only the beginning</title><desc id="desc">An illustrative gripper holds a mug. Vision, touch, force and proprioception feed state estimation. Grasp success depends on hidden friction, material properties, force control and timing; deformable materials add further difficulty.</desc>
<defs><marker id="arrow-087f83" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f83"/></marker><marker id="arrow-c76b2c" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#c76b2c"/></marker><marker id="arrow-396cc5" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#396cc5"/></marker><marker id="arrow-b74b53" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b74b53"/></marker><marker id="arrow-172f43" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#172f43"/></marker></defs><rect width="1200" height="813" fill="#fffaf2" rx="24"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
<text x="44" y="58" font-size="37" fill="#172f43" font-weight="700" text-anchor="start">Seeing an object is only the beginning</text><text x="44" y="98" font-size="24" fill="#536877" font-weight="400" text-anchor="start">Reliable manipulation needs state estimation and controlled contact</text>
<rect x="44" y="145" width="412" height="494" rx="18" fill="white" stroke="#d8e0e3" stroke-width="2"/><text x="70" y="187" font-size="23" fill="#087f83" font-weight="700" text-anchor="start">SENSING UNDER UNCERTAINTY</text><g transform="translate(112 258) scale(1.05)"><path d="M-34,0 Q0,-38 34,0 Q0,38 -34,0" fill="none" stroke="#087f83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="0" r="10" fill="none" stroke="#087f83" stroke-width="3"/></g><text x="175" y="246" font-size="25" fill="#172f43" font-weight="400" text-anchor="start">Vision and depth</text><text x="175" y="280" font-size="25" fill="#172f43" font-weight="400" text-anchor="start">geometry / occlusion</text><g transform="translate(112 370) scale(1.05)"><path d="M-26,22 L-26,-5 Q-26,-16 -17,-8 L-10,0 L-10,-27 Q-10,-36 -3,-27 L-3,-10 L5,-34 Q10,-41 14,-30 L12,-8 L22,-24 Q29,-31 32,-20 L23,12 Q15,35 -3,32 Z" fill="none" stroke="#c76b2c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="175" y="357" font-size="25" fill="#172f43" font-weight="400" text-anchor="start">Touch and force</text><text x="175" y="391" font-size="25" fill="#172f43" font-weight="400" text-anchor="start">contact / incipient slip</text><g transform="translate(112 480) scale(1.05)"><rect x="-27" y="-25" width="54" height="40" rx="8" fill="none" stroke="#396cc5" stroke-width="3"/><circle cx="-12" cy="-5" r="4" fill="#396cc5" stroke="#396cc5" stroke-width="3"/><circle cx="12" cy="-5" r="4" fill="#396cc5" stroke="#396cc5" stroke-width="3"/><path d="M0,-25 V-34 M-19,26 H19 M-14,15 V26 M14,15 V26" fill="none" stroke="#396cc5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="175" y="468" font-size="25" fill="#172f43" font-weight="400" text-anchor="start">Proprioception</text><text x="175" y="502" font-size="25" fill="#172f43" font-weight="400" text-anchor="start">joints / body motion</text><text x="70" y="561" font-size="25" fill="#087f83" font-weight="600" text-anchor="start">Fuse signals.</text><text x="70" y="595" font-size="25" fill="#087f83" font-weight="600" text-anchor="start">Represent uncertainty.</text><path d="M465,382 L543,382" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow-087f83)"/><rect x="560" y="145" width="596" height="494" rx="18" fill="#f0f4fa" stroke="none" stroke-width="2"/><text x="588" y="187" font-size="23" fill="#396cc5" font-weight="700" text-anchor="start">PHYSICAL INTERACTION</text><path d="M684,254 V320 H752 V371 M1034,254 V320 H966 V371" fill="none" stroke="#172f43" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M777,321 V446 Q777,469 807,469 H910 Q940,469 940,446 V321 Z" fill="#e4f2ef" stroke="#087f83" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M942,350 H964 Q1000,350 1000,389 Q1000,425 942,425" fill="none" stroke="#087f83" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="751" y="356" width="23" height="55" rx="9" fill="#efad79" stroke="none" stroke-width="2"/><rect x="942" y="356" width="23" height="55" rx="9" fill="#efad79" stroke="none" stroke-width="2"/><path d="M718,389 L774,389" fill="none" stroke="#c76b2c" stroke-width="3" marker-end="url(#arrow-c76b2c)"/><path d="M1003,389 L947,389" fill="none" stroke="#c76b2c" stroke-width="3" marker-end="url(#arrow-c76b2c)"/><path d="M857,419 L857,484" fill="none" stroke="#396cc5" stroke-width="3" marker-end="url(#arrow-396cc5)"/><text x="881" y="494" font-size="22" fill="#396cc5" font-weight="400" text-anchor="start">gravity</text><text x="589" y="552" font-size="25" fill="#172f43" font-weight="400" text-anchor="start">Estimate hidden friction and material state.</text><text x="589" y="591" font-size="25" fill="#172f43" font-weight="400" text-anchor="start">Control grip force, compliance and timing.</text><rect x="44" y="669" width="1112" height="68" rx="12" fill="#f9eadb" stroke="none" stroke-width="2"/><text x="72" y="712" font-size="26" fill="#172f43" font-weight="600" text-anchor="start">Fragile objects, cables, cloth and fluids expose the limits of vision alone.</text>
<path d="M44,760 H1156" fill="none" stroke="#d8e0e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="789" font-size="20" fill="#536877" font-weight="400" text-anchor="start">Conceptual synthesis • 5 Nov 2026</text>
</g></svg>