rception and state</text><text x="145" y="366" font-size="22" fill="#536877" font-weight="400" text-anchor="start">What is hidden or uncertain?</text><rect x="612" y="270" width="548" height="116" rx="16" fill="white" stroke="#d8e0e3" stroke-width="2"/><g transform="translate(661 326) scale(0.72)"><path d="M-26,22 L-26,-5 Q-26,-16 -17,-8 L-10,0 L-10,-27 Q-10,-36 -3,-27 L-3,-10 L5,-34 Q10,-41 14,-30 L12,-8 L22,-24 Q29,-31 32,-20 L23,12 Q15,35 -3,32 Z" fill="none" stroke="#c76b2c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="713" y="306" font-size="20" fill="#c76b2c" font-weight="700" text-anchor="start">04</text><text x="713" y="337" font-size="27" fill="#172f43" font-weight="650" text-anchor="start">Dexterous contact</text><text x="713" y="366" font-size="22" fill="#536877" font-weight="400" text-anchor="start">Force, slip and deformation</text><rect x="44" y="405" width="548" height="116" rx="16" fill="white" stroke="#d8e0e3" stroke-width="2"/><g transform="translate(93 461) scale(0.72)"><rect x="-28" y="-24" width="56" height="48" rx="8" fill="none" stroke="#c76b2c" stroke-width="3"/><path d="M-15,-10 H14 M-15,2 H18 M-15,14 H3" fill="none" stroke="#c76b2c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="145" y="441" font-size="20" fill="#c76b2c" font-weight="700" text-anchor="start">05</text><text x="145" y="472" font-size="27" fill="#172f43" font-weight="650" text-anchor="start">Memory and planning</text><text x="145" y="501" font-size="22" fill="#536877" font-weight="400" text-anchor="start">Keep a task coherent over time</text><rect x="612" y="405" width="548" height="116" rx="16" fill="white" stroke="#d8e0e3" stroke-width="2"/><g transform="translate(661 461) scale(0.72)"><path d="M-27,12 A29,29 0 1,1 24,16 M24,16 V-3 M24,16 H6" fill="none" stroke="#c76b2c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9,2 L0,11 L14,-9" fill="none" stroke="#c76b2c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="713" y="441" font-size="20" fill="#c76b2c" font-weight="700" text-anchor="start">06</text><text x="713" y="472" font-size="27" fill="#172f43" font-weight="650" text-anchor="start">Learning after deployment</text><text x="713" y="501" font-size="22" fill="#536877" font-weight="400" text-anchor="start">Improve without forgetting</text><rect x="44" y="540" width="548" height="116" rx="16" fill="white" stroke="#d8e0e3" stroke-width="2"/><g transform="translate(93 596) scale(0.72)"><circle cx="0" cy="0" r="29" fill="none" stroke="#396cc5" stroke-width="3"/><path d="M0,-18 V0 L16,9" fill="none" stroke="#396cc5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="145" y="576" font-size="20" fill="#396cc5" font-weight="700" text-anchor="start">07</text><text x="145" y="607" font-size="27" fill="#172f43" font-weight="650" text-anchor="start">Real-time computation</text><text x="145" y="636" font-size="22" fill="#536877" font-weight="400" text-anchor="start">Act before observations go stale</text><rect x="612" y="540" width="548" height="116" rx="16" fill="white" stroke="#d8e0e3" stroke-width="2"/><g transform="translate(661 596) scale(0.72)"><circle cx="3" cy="-27" r="8" fill="none" stroke="#396cc5" stroke-width="3"/><path d="M0,-16 L-6,8 L-27,29 M-6,8 L14,17 L23,35 M0,-12 L19,0 L30,-1 M0,-10 L-19,-1" fill="none" stroke="#396cc5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="713" y="576" font-size="20" fill="#396cc5" font-weight="700" text-anchor="start">08</text><text x="713" y="607" font-size="27" fill="#172f43" font-weight="650" text-anchor="start">Whole-body mobility</text><text x="713" y="636" font-size="22" fill="#536877" font-weight="400" text-anchor="start">Move, reach and balance together</text><rect x="44" y="675" width="548" height="116" rx="16" fill="white" stroke="#d8e0e3" stroke-width="2"/><g transform="translate(93 731) scale(0.72)"><path d="M0,-33 L28,-22 V0 Q27,24 0,35 Q-27,24 -28,0 V-22 Z" fill="none" stroke="#396cc5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12,1 L-2,12 L16,-10" fill="none" stroke="#396cc5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="145" y="711" font-size="20" fill="#396cc5" font-weight="700" text-anchor="start">09</text><text x="145" y="742" font-size="27" fill="#172f43" font-weight="650" text-anchor="start">Safety and robustness</text><text x="145" y="771" font-size="22" fill="#536877" font-weight="400" text-anchor="start">Bound risk under surprises</text><rect x="612" y="675" width="548" height="116" rx="16" fill="white" stroke="#d8e0e3" stroke-width="2"/><g transform="translate(661 731) scale(0.72)"><circle cx="0" cy="-21" r="10" fill="none" stroke="#b74b53" stroke-width="3"/><path d="M0,-9 V19 M-20,2 L0,-6 L20,2 M0,19 L-17,36 M0,19 L17,36" fill="none" stroke="#b74b53" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="713" y="711" font-size="20" fill="#b74b53" font-weight="700" text-anchor="start">10</text><text x="713" y="742" font-size="27" fill="#172f43" font-weight="650" text-anchor="start">People and robot teams</text><text x="713" y="771" font-size="22" fill="#536877" font-weight="400" text-anchor="start">Clarify intent and coordinate</text><rect x="44" y="810" width="548" height="116" rx="16" fill="white" stroke="#d8e0e3" stroke-width="2"/><g transform="translate(93 866) scale(0.72)"><rect x="-27" y="-30" width="54" height="64" rx="7" fill="none" stroke="#b74b53" stroke-width="3"/><path d="M-15,-11 L-10,-6 L-2,-16 M5,-11 H17 M-15,10 L-10,15 L-2,5 M5,10 H17" fill="none" stroke="#b74b53" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="145" y="846" font-size="20" fill="#b74b53" font-weight="700" text-anchor="start">11</text><text x="145" y="877" font-size="27" fill="#172f43" font-weight="650" text-anchor="start">Evaluation</text><text x="145" y="906" font-size="22" fill="#536877" font-weight="400" text-anchor="start">Measure transfer and recovery</text><rect x="612" y="810" width="548" height="116" rx="16" fill="white" stroke="#d8e0e3" stroke-width="2"/><g transform="translate(661 866) scale(0.72)"><rect x="-33" y="-19" width="60" height="38" rx="6" fill="none" stroke="#b74b53" stroke-width="3"/><rect x="29" y="-8" width="7" height="16" rx="2" fill="#b74b53" stroke="#b74b53" stroke-width="2"/><path d="M-6,-12 L-15,3 H-3 L-10,14 L9,-3 H-3 L5,-12" fill="#b74b53" stroke="#b74b53" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="713" y="846" font-size="20" fill="#b74b53" font-weight="700" text-anchor="start">12</text><text x="713" y="877" font-size="27" fill="#172f43" font-weight="650" text-anchor="start">Persistent deployment</text><text x="713" y="906" font-size="22" fill="#536877" font-weight="400" text-anchor="start">Energy, wear, uptime and cost</text>
