<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="772" viewBox="0 0 1200 772" role="img" aria-labelledby="title desc">
<title id="title">Long tasks amplify small failures</title><desc id="desc">Locate, grasp, carry, place and verify form a task sequence supported by memory and recovery. Under an illustrative independent-step model with no recovery, 20 steps succeed with probability p to the twentieth power: 35.8 percent for p of 0.95 and 81.8 percent for p of 0.99.</desc>
<defs><marker id="arrow-087f83" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f83"/></marker><marker id="arrow-c76b2c" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#c76b2c"/></marker><marker id="arrow-396cc5" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#396cc5"/></marker><marker id="arrow-b74b53" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b74b53"/></marker><marker id="arrow-172f43" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#172f43"/></marker></defs><rect width="1200" height="772" fill="#fffaf2" rx="24"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
<text x="44" y="58" font-size="37" fill="#172f43" font-weight="700" text-anchor="start">Long tasks amplify small failures</text><text x="44" y="98" font-size="24" fill="#536877" font-weight="400" text-anchor="start">Remember state, verify progress and recover when the plan breaks</text>
<text x="44" y="158" font-size="23" fill="#087f83" font-weight="700" text-anchor="start">SKILLS MUST FORM A COHERENT JOB</text><rect x="44" y="187" width="202" height="80" rx="12" fill="#edf5f3" stroke="none" stroke-width="2"/><text x="145" y="237" font-size="28" fill="#087f83" font-weight="650" text-anchor="middle">Locate</text><path d="M248,227 L267,227" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow-087f83)"/><rect x="269" y="187" width="202" height="80" rx="12" fill="#edf5f3" stroke="none" stroke-width="2"/><text x="370" y="237" font-size="28" fill="#087f83" font-weight="650" text-anchor="middle">Grasp</text><path d="M473,227 L492,227" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow-087f83)"/><rect x="494" y="187" width="202" height="80" rx="12" fill="#edf5f3" stroke="none" stroke-width="2"/><text x="595" y="237" font-size="28" fill="#087f83" font-weight="650" text-anchor="middle">Carry</text><path d="M698,227 L717,227" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow-087f83)"/><rect x="719" y="187" width="202" height="80" rx="12" fill="#edf5f3" stroke="none" stroke-width="2"/><text x="820" y="237" font-size="28" fill="#087f83" font-weight="650" text-anchor="middle">Place</text><path d="M923,227 L942,227" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow-087f83)"/><rect x="944" y="187" width="202" height="80" rx="12" fill="#edf5f3" stroke="none" stroke-width="2"/><text x="1045" y="237" font-size="28" fill="#087f83" font-weight="650" text-anchor="middle">Verify</text><rect x="151" y="320" width="433" height="125" rx="18" fill="white" stroke="#d8e0e3" stroke-width="2"/><text x="178" y="360" font-size="28" fill="#396cc5" font-weight="650" text-anchor="start">Memory</text><text x="178" y="399" font-size="24" fill="#536877" font-weight="400" text-anchor="start">What changed? What worked?</text><rect x="615" y="320" width="433" height="125" rx="18" fill="white" stroke="#d8e0e3" stroke-width="2"/><text x="642" y="360" font-size="28" fill="#c76b2c" font-weight="650" text-anchor="start">Recovery</text><text x="642" y="399" font-size="24" fill="#536877" font-weight="400" text-anchor="start">Detect → diagnose → retry or ask</text><path d="M1048,382 H1125 V286 H1045" fill="none" stroke="#c76b2c" stroke-width="3" marker-end="url(#arrow-c76b2c)"/><path d="M368,320 L368,273" fill="none" stroke="#396cc5" stroke-width="3" marker-end="url(#arrow-396cc5)"/><rect x="44" y="486" width="1112" height="211" rx="18" fill="#f0f4fa" stroke="none" stroke-width="2"/><text x="73" y="529" font-size="23" fill="#396cc5" font-weight="700" text-anchor="start">WHY SMALL ERRORS MATTER</text><text x="73" y="571" font-size="25" fill="#172f43" font-weight="400" text-anchor="start">Illustration: 20 independent steps, equal success p, no recovery.</text><text x="73" y="644" font-size="29" fill="#536877" font-weight="500" text-anchor="start">p = 0.95</text><text x="271" y="644" font-size="30" fill="#536877" font-weight="400" text-anchor="start">→</text><text x="324" y="644" font-size="40" fill="#c76b2c" font-weight="750" text-anchor="start">35.8%</text><text x="568" y="644" font-size="29" fill="#536877" font-weight="500" text-anchor="start">p = 0.99</text><text x="767" y="644" font-size="30" fill="#536877" font-weight="400" text-anchor="start">→</text><text x="821" y="644" font-size="40" fill="#087f83" font-weight="750" text-anchor="start">81.8%</text><text x="73" y="681" font-size="22" fill="#536877" font-weight="400" text-anchor="start">Full completion probability = p²⁰. These are calculated examples, not robot scores.</text>
<path d="M44,719 H1156" fill="none" stroke="#d8e0e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="748" font-size="20" fill="#536877" font-weight="400" text-anchor="start">Conceptual synthesis • 5 Nov 2026</text>
</g></svg>