<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="765" viewBox="0 0 1200 765" role="img" aria-labelledby="title desc">
<title id="title">Scale useful experience, then close the loop</title><desc id="desc">Robot demonstrations, human videos, simulation and autonomous experience have complementary advantages and limitations. A learning loop should curate data, track provenance and test whether updates forget prior capabilities.</desc>
<defs><marker id="arrow-087f83" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f83"/></marker><marker id="arrow-c76b2c" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#c76b2c"/></marker><marker id="arrow-396cc5" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#396cc5"/></marker><marker id="arrow-b74b53" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b74b53"/></marker><marker id="arrow-172f43" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#172f43"/></marker></defs><rect width="1200" height="765" fill="#fffaf2" rx="24"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
<text x="44" y="58" font-size="37" fill="#172f43" font-weight="700" text-anchor="start">Scale useful experience, then close the loop</text><text x="44" y="98" font-size="24" fill="#536877" font-weight="400" text-anchor="start">Data quantity helps only when coverage, alignment and feedback are useful</text>
<rect x="44" y="151" width="538" height="166" rx="18" fill="white" stroke="#d8e0e3" stroke-width="2"/><g transform="translate(99 211) scale(0.8)"><rect x="-27" y="-25" width="54" height="40" rx="8" fill="none" stroke="#087f83" stroke-width="3"/><circle cx="-12" cy="-5" r="4" fill="#087f83" stroke="#087f83" stroke-width="3"/><circle cx="12" cy="-5" r="4" fill="#087f83" stroke="#087f83" stroke-width="3"/><path d="M0,-25 V-34 M-19,26 H19 M-14,15 V26 M14,15 V26" fill="none" stroke="#087f83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="149" y="207" font-size="27" fill="#172f43" font-weight="650" text-anchor="start">Robot demonstrations</text><text x="70" y="283" font-size="24" fill="#536877" font-weight="400" text-anchor="start">Action-aligned; costly to collect</text><rect x="618" y="151" width="538" height="166" rx="18" fill="white" stroke="#d8e0e3" stroke-width="2"/><g transform="translate(673 211) scale(0.8)"><circle cx="0" cy="-21" r="10" fill="none" stroke="#396cc5" stroke-width="3"/><path d="M0,-9 V19 M-20,2 L0,-6 L20,2 M0,19 L-17,36 M0,19 L17,36" fill="none" stroke="#396cc5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="723" y="207" font-size="27" fill="#172f43" font-weight="650" text-anchor="start">Human video</text><text x="644" y="283" font-size="24" fill="#536877" font-weight="400" text-anchor="start">Broad coverage; missing robot actions</text><rect x="44" y="348" width="538" height="166" rx="18" fill="white" stroke="#d8e0e3" stroke-width="2"/><g transform="translate(99 408) scale(0.8)"><rect x="-29" y="-29" width="58" height="17" rx="5" fill="none" stroke="#c76b2c" stroke-width="3"/><rect x="-29" y="-9" width="58" height="17" rx="5" fill="none" stroke="#c76b2c" stroke-width="3"/><rect x="-29" y="11" width="58" height="17" rx="5" fill="none" stroke="#c76b2c" stroke-width="3"/></g><text x="149" y="404" font-size="27" fill="#172f43" font-weight="650" text-anchor="start">Simulation and world models</text><text x="70" y="480" font-size="24" fill="#536877" font-weight="400" text-anchor="start">Scalable; imperfect contact physics</text><rect x="618" y="348" width="538" height="166" rx="18" fill="white" stroke="#d8e0e3" stroke-width="2"/><g transform="translate(673 408) scale(0.8)"><path d="M-27,12 A29,29 0 1,1 24,16 M24,16 V-3 M24,16 H6" fill="none" stroke="#b74b53" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9,2 L0,11 L14,-9" fill="none" stroke="#b74b53" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="723" y="404" font-size="27" fill="#172f43" font-weight="650" text-anchor="start">Trials and corrections</text><text x="644" y="480" font-size="24" fill="#536877" font-weight="400" text-anchor="start">Reveal failures; require safe exploration</text><text x="600" y="342" font-size="33" fill="#087f83" font-weight="500" text-anchor="middle">+</text><rect x="44" y="549" width="1112" height="141" rx="18" fill="#edf5f3" stroke="none" stroke-width="2"/><text x="72" y="592" font-size="23" fill="#087f83" font-weight="700" text-anchor="start">THE DATA ENGINE</text><text x="72" y="632" font-size="27" fill="#172f43" font-weight="600" text-anchor="start">Collect → curate → train → deploy → inspect failures → collect</text><text x="72" y="669" font-size="23" fill="#536877" font-weight="400" text-anchor="start">Keep provenance, embodiment labels, failure cases and tests for forgetting.</text>
<path d="M44,712 H1156" fill="none" stroke="#d8e0e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="741" font-size="20" fill="#536877" font-weight="400" text-anchor="start">Conceptual synthesis • 5 Nov 2026</text>
</g></svg>