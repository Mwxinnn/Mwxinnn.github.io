<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">Generalization is more than a new object</title><desc id="desc">Training on familiar scenes, bodies and skills must transfer to held-out objects, scenes, embodiments and task combinations. Evaluation should disclose fine-tuning, coaching and human assistance.</desc>
<defs><marker id="arrow-087f83" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f83"/></marker><marker id="arrow-c76b2c" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#c76b2c"/></marker><marker id="arrow-396cc5" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#396cc5"/></marker><marker id="arrow-b74b53" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b74b53"/></marker><marker id="arrow-172f43" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#172f43"/></marker></defs><rect width="1200" height="730" fill="#fffaf2" rx="24"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
<text x="44" y="58" font-size="37" fill="#172f43" font-weight="700" text-anchor="start">Generalization is more than a new object</text><text x="44" y="98" font-size="24" fill="#536877" font-weight="400" text-anchor="start">Can a policy recombine skills when the scene and robot also change?</text>
<rect x="44" y="145" width="340" height="350" rx="18" fill="#edf5f3" stroke="none" stroke-width="2"/><text x="72" y="187" font-size="23" fill="#087f83" font-weight="700" text-anchor="start">TRAINING EXPERIENCE</text><g transform="translate(125 276) scale(1.15)"><rect x="-27" y="-25" width="54" height="40" rx="8" fill="none" stroke="#087f83" stroke-width="3"/><circle cx="-12" cy="-5" r="4" fill="#087f83" stroke="#087f83" stroke-width="3"/><circle cx="12" cy="-5" r="4" fill="#087f83" stroke="#087f83" stroke-width="3"/><path d="M0,-25 V-34 M-19,26 H19 M-14,15 V26 M14,15 V26" fill="none" stroke="#087f83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(290 276) scale(1.15)"><path d="M-26,22 L-26,-5 Q-26,-16 -17,-8 L-10,0 L-10,-27 Q-10,-36 -3,-27 L-3,-10 L5,-34 Q10,-41 14,-30 L12,-8 L22,-24 Q29,-31 32,-20 L23,12 Q15,35 -3,32 Z" fill="none" stroke="#087f83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="72" y="357" font-size="26" fill="#172f43" font-weight="400" text-anchor="start">Known scenes</text><text x="72" y="399" font-size="26" fill="#172f43" font-weight="400" text-anchor="start">Known robot bodies</text><text x="72" y="441" font-size="26" fill="#172f43" font-weight="400" text-anchor="start">Demonstrated skills</text><path d="M405,315 L520,315" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow-087f83)"/><text x="463" y="285" font-size="23" fill="#087f83" font-weight="600" text-anchor="middle">transfer</text><rect x="542" y="145" width="614" height="350" rx="18" fill="white" stroke="#d8e0e3" stroke-width="2"/><text x="572" y="187" font-size="23" fill="#396cc5" font-weight="700" text-anchor="start">HELD-OUT CONDITIONS</text><rect x="574" y="221" width="259" height="99" rx="12" fill="#f0f4fa" stroke="none" stroke-width="2"/><text x="594" y="257" font-size="28" fill="#396cc5" font-weight="650" text-anchor="start">Objects</text><text x="594" y="293" font-size="24" fill="#536877" font-weight="400" text-anchor="start">shape / material</text><rect x="857" y="221" width="259" height="99" rx="12" fill="#f0f4fa" stroke="none" stroke-width="2"/><text x="877" y="257" font-size="28" fill="#396cc5" font-weight="650" text-anchor="start">Scenes</text><text x="877" y="293" font-size="24" fill="#536877" font-weight="400" text-anchor="start">clutter / lighting</text><rect x="574" y="342" width="259" height="99" rx="12" fill="#f0f4fa" stroke="none" stroke-width="2"/><text x="594" y="378" font-size="28" fill="#396cc5" font-weight="650" text-anchor="start">Bodies</text><text x="594" y="414" font-size="24" fill="#536877" font-weight="400" text-anchor="start">reach / sensors</text><rect x="857" y="342" width="259" height="99" rx="12" fill="#f0f4fa" stroke="none" stroke-width="2"/><text x="877" y="378" font-size="28" fill="#396cc5" font-weight="650" text-anchor="start">Tasks</text><text x="877" y="414" font-size="24" fill="#536877" font-weight="400" text-anchor="start">novel combinations</text><rect x="44" y="529" width="1112" height="125" rx="18" fill="#f9eadb" stroke="none" stroke-width="2"/><text x="72" y="571" font-size="22" fill="#c76b2c" font-weight="700" text-anchor="start">THE HARD TEST</text><text x="72" y="610" font-size="26" fill="#172f43" font-weight="400" text-anchor="start">Combine several shifts at once; disclose every form of adaptation and help.</text>
