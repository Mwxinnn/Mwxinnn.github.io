<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Safe autonomy includes people</title><desc id="desc">A proposed layered architecture separates intent interpretation, constrained planning, execution monitoring and recovery. A mobile robot yields around a person in shared space. Hazard recognition alone does not establish safe execution or a formal safety guarantee.</desc>
<defs><marker id="arrow-087f83" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f83"/></marker><marker id="arrow-c76b2c" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#c76b2c"/></marker><marker id="arrow-396cc5" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#396cc5"/></marker><marker id="arrow-b74b53" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b74b53"/></marker><marker id="arrow-172f43" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#172f43"/></marker></defs><rect width="1200" height="800" fill="#fffaf2" rx="24"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
<text x="44" y="58" font-size="37" fill="#172f43" font-weight="700" text-anchor="start">Safe autonomy includes people</text><text x="44" y="98" font-size="24" fill="#536877" font-weight="400" text-anchor="start">Risk-aware decisions, executable mitigation and understandable teamwork</text>
<text x="44" y="157" font-size="23" fill="#396cc5" font-weight="700" text-anchor="start">A POSSIBLE SAFETY ARCHITECTURE</text><rect x="44" y="184" width="636" height="84" rx="12" fill="white" stroke="#d8e0e3" stroke-width="2"/><circle cx="79" cy="226" r="19" fill="#396cc5" stroke="#396cc5" stroke-width="3"/><text x="79" y="234" font-size="22" fill="white" font-weight="650" text-anchor="middle">1</text><text x="113" y="218" font-size="27" fill="#396cc5" font-weight="650" text-anchor="start">Interpret intent</text><text x="113" y="250" font-size="23" fill="#536877" font-weight="400" text-anchor="start">Clarify ambiguity; reject unsafe goals</text><path d="M361,270 L361,282" fill="none" stroke="#396cc5" stroke-width="3" marker-end="url(#arrow-396cc5)"/><rect x="44" y="284" width="636" height="84" rx="12" fill="white" stroke="#d8e0e3" stroke-width="2"/><circle cx="79" cy="326" r="19" fill="#087f83" stroke="#087f83" stroke-width="3"/><text x="79" y="334" font-size="22" fill="white" font-weight="650" text-anchor="middle">2</text><text x="113" y="318" font-size="27" fill="#087f83" font-weight="650" text-anchor="start">Plan within limits</text><text x="113" y="350" font-size="23" fill="#536877" font-weight="400" text-anchor="start">Check hazards and action prerequisites</text><path d="M361,370 L361,382" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow-087f83)"/><rect x="44" y="384" width="636" height="84" rx="12" fill="white" stroke="#d8e0e3" stroke-width="2"/><circle cx="79" cy="426" r="19" fill="#c76b2c" stroke="#c76b2c" stroke-width="3"/><text x="79" y="434" font-size="22" fill="white" font-weight="650" text-anchor="middle">3</text><text x="113" y="418" font-size="27" fill="#c76b2c" font-weight="650" text-anchor="start">Monitor execution</text><text x="113" y="450" font-size="23" fill="#536877" font-weight="400" text-anchor="start">Enforce motion limits; detect deviations</text><path d="M361,470 L361,482" fill="none" stroke="#c76b2c" stroke-width="3" marker-end="url(#arrow-c76b2c)"/><rect x="44" y="484" width="636" height="84" rx="12" fill="white" stroke="#d8e0e3" stroke-width="2"/><circle cx="79" cy="526" r="19" fill="#b74b53" stroke="#b74b53" stroke-width="3"/><text x="79" y="534" font-size="22" fill="white" font-weight="650" text-anchor="middle">4</text><text x="113" y="518" font-size="27" fill="#b74b53" font-weight="650" text-anchor="start">Recover or hand over</text><text x="113" y="550" font-size="23" fill="#536877" font-weight="400" text-anchor="start">Stop safely; request help when needed</text><rect x="711" y="184" width="445" height="384" rx="18" fill="#edf5f3" stroke="none" stroke-width="2"/><text x="738" y="225" font-size="22" fill="#087f83" font-weight="700" text-anchor="start">SHARED SPACE AND GOALS</text><g transform="translate(805 321) scale(1.4)"><circle cx="0" cy="-21" r="10" fill="none" stroke="#396cc5" stroke-width="3"/><path d="M0,-9 V19 M-20,2 L0,-6 L20,2 M0,19 L-17,36 M0,19 L17,36" fill="none" stroke="#396cc5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(1065 425) scale(1.1)"><rect x="-27" y="-25" width="54" height="40" rx="8" fill="none" stroke="#087f83" stroke-width="3"/><circle cx="-12" cy="-5" r="4" fill="#087f83" stroke="#087f83" stroke-width="3"/><circle cx="12" cy="-5" r="4" fill="#087f83" stroke="#087f83" stroke-width="3"/><path d="M0,-25 V-34 M-19,26 H19 M-14,15 V26 M14,15 V26" fill="none" stroke="#087f83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="805" cy="321" r="76" fill="none" stroke="#396cc5" stroke-width="2"/><path d="M1026,418 Q991,326 906,287" fill="none" stroke="#087f83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8"/><text x="737" y="499" font-size="23" fill="#172f43" font-weight="400" text-anchor="start">Yield, communicate, assign roles.</text><text x="737" y="534" font-size="23" fill="#172f43" font-weight="400" text-anchor="start">Measure comfort as well as success.</text><rect x="44" y="610" width="1112" height="114" rx="18" fill="#f9eadb" stroke="none" stroke-width="2"/><text x="72" y="652" font-size="22" fill="#c76b2c" font-weight="700" text-anchor="start">OPEN PROBLEM</text><text x="72" y="692" font-size="26" fill="#172f43" font-weight="600" text-anchor="start">Recognizing a hazard does not ensure that the robot can mitigate it safely.</text>
<path d="M44,747 H1156" fill="none" stroke="#d8e0e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="776" font-size="20" fill="#536877" font-weight="400" text-anchor="start">Conceptual synthesis • 5 Nov 2026</text>
</g></svg>