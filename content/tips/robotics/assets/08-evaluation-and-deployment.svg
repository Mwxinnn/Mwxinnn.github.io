<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="928" viewBox="0 0 1200 928" role="img" aria-labelledby="title desc">
<title id="title">Measure dependable work over time</title><desc id="desc">A proposed evaluation workflow moves from simulation stress tests to real robots and long operation. Report full-task completion, assistance, latency, safety, persistence and cost. Operational research also includes calibration, maintenance, integration, cybersecurity and privacy.</desc>
